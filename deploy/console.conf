map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 0;
    client_body_timeout 60s;

    location = /healthz { return 200 "ok\n"; }

    location /api/audio/ {
        set $backend controller:8080;
        rewrite ^/api/audio(/.*)$ $1 break;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /api/video/ {
        default_type application/json;
        set $mock_enabled ${MOCK_ENABLED};
        if ($mock_enabled = 0) { return 503 '{"error":"Mock video is disabled in base mode"}'; }
        set $backend mock:8080;
        rewrite ^/api/video(/.*)$ $1 break;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_intercept_errors on;
        error_page 502 504 = @mock_unavailable;
    }
    location @mock_unavailable {
        default_type application/json;
        return 503 '{"error":"Mock video service is unavailable"}';
    }
    location = / { rewrite ^ /index.html last; }
    location / { try_files $uri =404; }
}
