server {
    listen 80;
    absolute_redirect off;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location = /healthz { return 200 "ok\n"; }
    location = /api/audio/ws {
        set $controller controller:8080;
        rewrite ^ /ws break;
        proxy_pass http://$controller;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
    location = /runtime.json {
        add_header Cache-Control "no-store";
    }
    location ~ ^/gateway/[a-zA-Z0-9_/-]+/whep(/[-a-zA-Z0-9]+)?$ {
        limit_except POST DELETE OPTIONS { deny all; }
        set $backend mediamtx:8889;
        rewrite ^/gateway(/.*)$ $1 break;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
        proxy_redirect ~^(/.*)$ /gateway$1;
        proxy_redirect ~^https?://[^/]+(/.*)$ /gateway$1;
    }
    location = / { rewrite ^ /index.html last; }
    location / { try_files $uri =404; }
}
